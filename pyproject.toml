[project]
name = "glm-4.7-flash-abliteration"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "gguf"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.21"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
fixable = ["ALL"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
